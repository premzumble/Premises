<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Smart Attendance & Premises Monitoring">
  <meta name="apple-mobile-web-app-title" content="Premises">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Premises</title>
  <link rel="manifest" href="manifest.json">
  <script src="https://maps.googleapis.com/maps/api/js?key="></script>
</head>
<body>
  <div id="loading-indicator">
    <div class="spinner-container">
      <img class="logo" src="favicon.png" alt="Premises Logo">
      <div class="ring"></div>
    </div>
  </div>
  <style>
    body {
      background-color: #F9F9F6;
      margin: 0;
      padding: 0;
    }
    #loading-indicator {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #F9F9F6;
      z-index: 99999;
      transition: opacity 0.5s ease-out;
    }
    .spinner-container {
      position: relative;
      width: 90px;
      height: 90px;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .logo {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background-color: #ffffff;
      padding: 10px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
      animation: pulse 1.5s infinite ease-in-out;
      z-index: 2;
    }
    .ring {
      position: absolute;
      width: 76px;
      height: 76px;
      border: 2.5px solid rgba(46, 61, 48, 0.15);
      border-top: 2.5px solid #2E3D30;
      border-radius: 50%;
      animation: spin 2s linear infinite;
      z-index: 1;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes pulse {
      0%, 100% { transform: scale(0.92); opacity: 0.8; }
      50% { transform: scale(1.04); opacity: 1; }
    }
  </style>
  <script>
    window.addEventListener('flutter-first-frame', function() {
      var loader = document.getElementById('loading-indicator');
      if (loader) {
        loader.style.opacity = '0';
        setTimeout(function() {
          loader.remove();
        }, 500);
      }
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
